[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pu-outreach"
version = "0.1.0"
description = "Screenshot a LinkedIn profile (with ContactOut open) → Sheet row + Gmail draft. Never sends."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pillow>=10"]

[project.optional-dependencies]
names = ["pyarrow>=16"]
dev = ["pytest>=8"]

[project.scripts]
pu-outreach = "pu_outreach.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pu_outreach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
